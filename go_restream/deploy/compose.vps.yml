services:
  streamdesk:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prebuilt
    image: streamdesk:vps
    restart: unless-stopped
    env_file: .env.vps
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - streamdesk_data:/data
    tmpfs:
      - /dev/shm:size=512m,mode=1777
      - /data/config/output:size=128m,uid=10001,gid=10001,mode=0700
    mem_limit: 2g
    cpus: 1.75
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      STREAMDESK_PUBLIC_HOST: ${STREAMDESK_PUBLIC_HOST:?Set the public IP or hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  streamdesk_data:
  caddy_data:
  caddy_config:
