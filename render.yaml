services:
  - type: web
    name: tintustream-relay
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ADMIN_TOKEN
        sync: false
      - key: RTMP_URL
        sync: false
      - key: RTMP_KEY
        sync: false
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_B64
        sync: false
      - key: WORKER_URL
        value: https://rwitc-racing.kristopherreed0227-1etlk.workers.dev
      - key: RELAY_STATE_URL
        value: https://rwitc-racing.kristopherreed0227-1etlk.workers.dev/api/relay-state
      - key: RELAY_MEDIA_MODE
        value: copy
      - key: RELAY_HOST
        value: 0.0.0.0
      - key: RENDER
        value: "true"
      # Adopt any live broadcast from a channel the session belongs to, so a
      # new racing feed needs no redeploy. The relay's own output channel is
      # never restreamed back into itself.
      - key: RELAY_DISCOVER_CHANNELS
        value: "true"
      - key: RELAY_DISCOVERY_INTERVAL
        value: "120"
      # The playback token in this URL is a secret: sync:false makes Render
      # prompt for it at deploy time instead of storing it in this file.
      - key: RELAY_INPUT_URL
        sync: false
      # Keep the existing private invite as the publishing destination.
      - key: RELAY_CHANNEL
        value: "https://t.me/+-UyRaC_GVSw3NTU1"
      # Numeric output ID is only used to exclude RRR from source discovery.
      - key: RELAY_OUTPUT_CHAT_ID
        value: "4347395930"
